</div>
<!-- Vertical 1px Hairline Rule -->
<div class="w-[1px] shrink-0 self-stretch bg-[rgba(15,0,0,0.12)]"></div>
<!-- Right Column: 480px -->
<div class="w-[480px] shrink-0 pl-[48px] flex flex-col items-start text-left">
<form class="w-full m-0 p-0 flex flex-col items-start" onsubmit="event.preventDefault();">
<label class="block font-heading-md text-heading-md text-ink font-bold leading-[1.5] tracking-normal text-left" for="password-input">
          Mật khẩu mới
        </label>
<div class="h-2"></div>
<div class="w-full h-[40px] bg-surface-soft rounded-lg px-3 flex items-center justify-between border border-hairline focus-within:border-ink transition-colors">
<input autocomplete="new-password" class="w-full bg-transparent border-0 outline-none p-0 font-body-md text-body-md text-ink tracking-normal leading-[1.5]" id="password-input" required="" type="password" value="••••••••"/>

<div class="h-2"></div>

<button class="w-full h-[36px] bg-ink hover:bg-charcoal text-on-dark font-body-strong text-body-strong rounded-lg border-0 cursor-pointer flex items-center justify-center transition-colors focus:outline-none leading-none select-none tracking-normal" type="submit">

        </button>

<script>
    (function() {
      const toggleBtn = document.getElementById('toggle-btn');
      const passwordInput = document.getElementById('password-input');
      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', function() {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          toggleBtn.textContent = isPassword ? 'Ẩn' : 'Hiện';
        });
      }
    })();
