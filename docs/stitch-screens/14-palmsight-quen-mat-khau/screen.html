<html class="h-full" lang="vi"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><title>PalmSight</title><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"surface-dim":"#dadada","on-secondary":"#ffffff","hairline":"rgba(15,0,0,0.12)","ink-deep":"#0f0000","danger":"#ff3b30","on-error-container":"#93000a","on-dark":"#fdfcfc","tertiary-container":"#001c45","on-surface-variant":"#4d4545","secondary-fixed":"#e6e1e1","charcoal":"#302c2c","primary-container":"#201d1d","surface-dark":"#201d1d","canvas":"#fdfcfc","surface-container-highest":"#e3e2e2","hairline-strong":"#646262","on-tertiary":"#ffffff","success":"#30d158","ink":"#201d1d","surface-soft":"#f8f7f7","warning":"#ff9f0a","outline-variant":"#d0c4c3","primary-fixed":"#e8e1e0","on-secondary-fixed":"#1c1b1b","secondary":"#605e5e","tertiary-fixed-dim":"#adc6ff","surface-variant":"#e3e2e2","on-secondary-fixed-variant":"#484646","surface":"#faf9f9","surface-tint":"#625d5d","ash":"#9a9898","secondary-fixed-dim":"#c9c6c5","error-container":"#ffdad6","surface-container-lowest":"#ffffff","primary":"#050404","error":"#ba1a1a","surface-container":"#eeeeee","surface-card":"#f1eeee","on-surface":"#1a1c1c","surface-container-high":"#e9e8e8","tertiary-fixed":"#d8e2ff","secondary-container":"#e6e1e1","on-tertiary-fixed-variant":"#004493","on-primary-fixed-variant":"#4a4646","on-background":"#1a1c1c","body":"#424245","surface-dark-elevated":"#302c2c","mute":"#646262","inverse-surface":"#2f3131","stone":"#6e6e73","tertiary":"#000310","on-error":"#ffffff","on-tertiary-fixed":"#001a41","on-primary":"#ffffff","surface-container-low":"#f4f3f3","on-secondary-container":"#666464","on-primary-container":"#8a8484","inverse-on-surface":"#f1f0f0","outline":"#7f7575","surface-bright":"#faf9f9","accent":"#007aff","inverse-primary":"#ccc5c4","on-tertiary-container":"#2a82ff","primary-fixed-dim":"#ccc5c4","on-dark-mute":"#9a9898","on-primary-fixed":"#1e1b1b","background":"#faf9f9"},"borderRadius":{"DEFAULT":"0.125rem","lg":"0.25rem","xl":"0.5rem","full":"0.75rem"},"spacing":{"margin-desktop":"3rem","gutter":"1rem","margin":"1rem","space-lg":"1.5rem","margin-tablet":"2rem","space-md":"1rem","gutter-desktop":"1.5rem","space-xs":"0.25rem","space-xl":"2rem","space-sm":"0.5rem"},"fontFamily":{"display-xl":["\"JetBrains Mono, Berkeley Mono, monospace\""],"caption-md":["\"JetBrains Mono, Berkeley Mono, monospace\""],"button-md":["\"JetBrains Mono, Berkeley Mono, monospace\""],"display-xl-mobile":["JetBrains Mono"],"code-sm":["JetBrains Mono"],"heading-sm":["JetBrains Mono"],"heading-md":["\"JetBrains Mono, Berkeley Mono, monospace\""],"body-md":["\"JetBrains Mono, Berkeley Mono, monospace\""],"body-strong":["\"JetBrains Mono, Berkeley Mono, monospace\""],"heading-lg":["JetBrains Mono"],"body-sm":["JetBrains Mono"]},"fontSize":{"display-xl":["38px",{"lineHeight":"1.5","fontWeight":"700"}],"caption-md":["14px",{"lineHeight":"2","fontWeight":"400"}],"button-md":["16px",{"lineHeight":"2","fontWeight":"500"}],"display-xl-mobile":["28px",{"lineHeight":"42px","letterSpacing":"0px","fontWeight":"700"}],"code-sm":["12px",{"lineHeight":"18px","letterSpacing":"0px","fontWeight":"400"}],"heading-sm":["14px",{"lineHeight":"21px","letterSpacing":"0px","fontWeight":"700"}],"heading-md":["16px",{"lineHeight":"1.5","fontWeight":"700"}],"body-md":["16px",{"lineHeight":"1.5","fontWeight":"400"}],"body-strong":["16px",{"lineHeight":"1.5","fontWeight":"500"}],"heading-lg":["24px",{"lineHeight":"36px","letterSpacing":"0px","fontWeight":"700"}],"body-sm":["14px",{"lineHeight":"21px","letterSpacing":"0px","fontWeight":"400"}]}}}</script></head><body class="bg-canvas font-body-md text-ink min-h-screen flex flex-col justify-center items-center antialiased"><main class="w-full max-w-[960px] mx-auto px-4 sm:px-6 py-12 flex flex-col items-center justify-center"><div class="flex flex-col w-full">
<div class="w-full pt-[96px] pb-12 flex flex-col items-center">
<div class="w-full max-w-[960px] flex flex-col md:flex-row items-start justify-between gap-0">
<!-- Left Column (360px wide) -->
<div class="w-full md:w-[360px] shrink-0 text-left pr-0 md:pr-8">
<h1 class="font-display-xl text-display-xl text-ink leading-[1.3] mb-4">
          Quên mật khẩu
        </h1>
<p class="font-body-md text-body-md text-body leading-[1.5]">
          Nhập email đã đăng ký. Chúng tôi sẽ gửi link để đặt lại mật khẩu.
        </p>
</div>
<!-- Hairline Vertical Rule -->
<div class="hidden md:block w-px self-stretch bg-hairline"></div>
<!-- Right Column (480px wide) -->
<div class="w-full md:w-[480px] shrink-0 text-left pt-8 md:pt-0 pl-0 md:pl-8">
<form class="w-full flex flex-col" id="forgot-password-form" onsubmit="event.preventDefault(); handlePasswordReset();">
<!-- Field Group -->
<div class="flex flex-col w-full">
<label class="font-heading-md text-heading-md text-ink mb-2 block" for="email">
              Email
            </label>
<input class="w-full h-10 px-3 py-2 bg-surface-soft border border-hairline rounded-[4px] font-body-md text-body-md text-ink placeholder-ash focus:outline-none focus:border-ink transition-colors" id="email" name="email" placeholder="minhanh@example.com" required="" type="email"/>
</div>
<!-- 24px gap below input -->
<div class="h-6"></div>
<!-- Primary Button -->
<button class="w-full h-9 px-5 py-1 bg-surface-dark text-on-dark font-button-md text-button-md font-medium rounded-[4px] border-0 text-center cursor-pointer hover:bg-charcoal transition-colors select-none" id="submit-btn" type="submit">
            Gửi link đặt lại
          </button>
<!-- 24px gap below button -->
<div class="h-6"></div>
<!-- Caption Row -->
<div class="w-full text-left font-caption-md text-caption-md text-mute">
<span>Nhớ mật khẩu rồi? </span>
<a class="text-ink underline cursor-pointer hover:text-charcoal" href="#">
              Đăng nhập
            </a>
</div>
<!-- Status Message Container (hidden by default) -->
<div class="hidden mt-4 font-caption-md text-caption-md text-ink bg-surface-card p-3 border border-hairline rounded-[4px]" id="status-msg">
            Đã gửi link xác nhận vào hỘm thư của bạn.
          </div>
</form>
</div>
</div>
</div>
<script>
    function handlePasswordReset() {
      var btn = document.getElementById('submit-btn');
      var status = document.getElementById('status-msg');
      var emailInput = document.getElementById('email');

      if (!emailInput.value) return;

      btn.disabled = true;
      btn.innerText = 'Đang gửi...';

      setTimeout(function() {
        btn.innerText = 'Đã gửi link';
        btn.classList.remove('bg-surface-dark', 'hover:bg-charcoal');
        btn.classList.add('bg-charcoal');
        status.classList.remove('hidden');
      }, 600);
    }
  </script>
</div></main></body></html>
