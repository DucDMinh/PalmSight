<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="104" fill="#201d1d"/>
  <!-- Terminal hairline subtle inner frame -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="rgba(253, 252, 252, 0.16)" stroke-width="4"/>
  
  <!-- Terminal Prompt Header -->
  <text x="60" y="92" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="32" font-weight="700" fill="#9a9898" letter-spacing="2">&gt; PALMSIGHT</text>
  <rect x="310" y="68" width="18" height="28" fill="#fdfcfc"/>

  <!-- Minimalist Hand Contour -->
  <g transform="translate(56, 120)" stroke="#fdfcfc" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Palm & Finger Contours -->
    <path d="M 80 230 C 70 200, 60 160, 50 120 C 44 95, 64 80, 84 94 C 98 104, 114 135, 124 165" />
    <!-- Index finger -->
    <path d="M 124 165 C 128 120, 134 50, 142 20 C 146 -2, 172 -2, 176 20 C 182 55, 186 125, 188 160" />
    <!-- Middle finger -->
    <path d="M 188 160 C 192 110, 198 30, 204 4 C 208 -18, 234 -18, 238 4 C 244 35, 248 115, 250 160" />
    <!-- Ring finger -->
    <path d="M 250 160 C 254 120, 260 45, 266 22 C 270 2, 296 2, 300 22 C 304 55, 306 125, 306 170" />
    <!-- Pinky finger & outer edge -->
    <path d="M 306 170 C 312 140, 320 85, 328 70 C 334 56, 356 62, 356 82 C 356 120, 344 190, 340 230 C 334 290, 316 340, 280 354 C 240 370, 160 370, 120 354 C 90 340, 80 270, 80 230 Z" fill="#201d1d"/>

    <!-- Major Palm Lines in Amber / Accent -->
    <!-- Heart line -->
    <path d="M 324 190 C 270 200, 210 205, 170 175" stroke="#ff9f0a" stroke-width="10" stroke-dasharray="1 0"/>
    <!-- Head line -->
    <path d="M 120 220 C 170 225, 240 240, 310 260" stroke="#007aff" stroke-width="10"/>
    <!-- Life line -->
    <path d="M 120 220 C 150 250, 170 300, 160 340" stroke="#1b6e32" stroke-width="10"/>
  </g>
</svg>