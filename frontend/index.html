<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PalmSight — Bói chỉ tay AI Terminal</title>
    <meta
      name="description"
      content="PalmSight — Ứng dụng bói chỉ tay AI đa trường phái với phong cách giao diện Terminal Minimalist"
    />

    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#fdfcfc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PalmSight" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="alternate icon" href="/icon-192.png" />

    <!-- Content Security Policy -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://lh3.googleusercontent.com https://*.googleusercontent.com https://platform-lookaside.fbsbx.com https://*.fbsbx.com; connect-src 'self' http://localhost:* ws://localhost:* https://palmsight-api.onrender.com https://palmsight-backend.onrender.com https://*.onrender.com https://accounts.google.com https://graph.facebook.com https://www.facebook.com; frame-src 'self' https://accounts.google.com https://www.facebook.com https://web.facebook.com; media-src 'self' blob:; object-src 'none'; base-uri 'self';"
    />

    <!-- Monospace fonts from Google Fonts with Vietnamese charset support -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
